<style>
/* Layout: a single column of road-sign cards (topic band, word | status sign | figures row, title, points, source); tabs for building news, traffic news and the sign legend. */
:root {
  --bg: #efefec; --fg: #1c1d1f; --muted: #5d6066; --rule: #d3d3cd; --surface: #ffffff;
  --accent: #c8102e;
  /* sign palette, fixed in both themes like real signs */
  --sign-bg: #ffffff; --sign-fg: #141414; --sign-muted: #555555;
  --kresz-blue: #0057a8; --kresz-green: #00804a; --kresz-brown: #7a4a1f; --kresz-yellow: #ffcc00; --kresz-red: #c8102e; --kresz-white: #ffffff;
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151618; --fg: #ecece9; --muted: #a3a6ab; --rule: #34363a; --surface: #1d1f22; --accent: #ff5a6e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151618; --fg: #ecece9; --muted: #a3a6ab; --rule: #34363a; --surface: #1d1f22; --accent: #ff5a6e; color-scheme: dark; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 10px; border-bottom: 4px solid var(--fg); padding-bottom: 14px; }
.kicker { font-family: var(--font-display); font-weight: 700; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1; margin: 0; letter-spacing: -0.02em; text-transform: uppercase; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; }
.meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.tabs { display: flex; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--muted); padding: 8px 14px 9px; cursor: pointer; white-space: nowrap; }
.tab:first-child { padding-left: 0; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:hover { color: var(--fg); }
.tab .n { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 400; opacity: 0.75; margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-display); font-weight: 500; font-size: 0.88rem; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border: 1px solid var(--fg); display: inline-block; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-family: var(--font-mono); font-size: 0.78rem; opacity: 0.75; }
.tab:focus-visible, .chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#news { display: grid; gap: 18px; }

/* Sign card */
.sg { --band: var(--kresz-blue); background: var(--sign-bg); color: var(--sign-fg); border: 3px solid var(--sign-fg); min-width: 0; overflow-wrap: anywhere; }
.sg.melyepites { --band: var(--kresz-green); }
.sg.epitoipar { --band: var(--kresz-brown); }
.sg .band { background: var(--band); color: var(--kresz-white); padding: 7px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px;
  font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; }
.band .bl { min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.band a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.band a::after { content: " ↗"; }
.band .br { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.sticker { background: var(--kresz-red); color: var(--kresz-white); font-weight: 800; font-size: 0.7rem; letter-spacing: 0.1em; padding: 1px 9px; border-radius: 999px; border: 2px solid var(--kresz-white); }
.sg .inner { padding: 12px 16px 16px; display: grid; gap: 10px; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.top > * { height: 30px; display: flex; align-items: center; min-width: 0; }
.top .word { justify-self: start; }
.top .st { justify-self: center; }
.top .figs { justify-self: end; justify-content: flex-end; gap: 6px; }
.word { box-sizing: border-box; font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--band); border: 2px solid var(--band); padding: 0 9px; white-space: nowrap; }
.st { gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
.st svg { width: 28px; height: 28px; flex: none; }
.fig { box-sizing: border-box; height: 30px; display: inline-flex; align-items: center; background: var(--kresz-yellow); color: var(--sign-fg); font-family: var(--font-display); font-weight: 800; font-size: 0.9rem; padding: 0 9px; border: 2px solid var(--sign-fg); white-space: nowrap; }
.sg h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.2; margin: 0; text-transform: uppercase; letter-spacing: -0.01em; text-wrap: balance; }
.sg h3 a { color: inherit; text-decoration: none; }
.sg h3 a:hover { text-decoration: underline; text-decoration-color: var(--band); }
.lead { margin: 0; font-weight: 600; font-size: 0.97rem; }
.sg ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 0.97rem; }
.sg ul > li { border-left: 4px solid var(--band); padding-left: 10px; }
.sg .sum { margin: 0; font-size: 0.97rem; }
.sg .src { font-family: var(--font-mono); font-size: 0.75rem; color: var(--sign-muted); }

/* Legend tab */
.legend-sec { display: grid; gap: 12px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 10px; }
.lg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 12px; align-items: start; background: var(--surface); border: 1px solid var(--rule); padding: 10px 12px; }
.lg svg { width: 40px; height: 40px; grid-row: span 2; }
.lg b { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.04em; }
.lg span { font-size: 0.92rem; color: var(--muted); }
.lg .sw { width: 40px; height: 24px; border: 2px solid var(--fg); grid-row: span 2; box-sizing: border-box; }
.note { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 62ch; }

.empty { color: var(--muted); padding: 24px 0; }
.status { font-size: 0.9rem; color: var(--muted); }
.status.err { color: var(--accent); }
footer { font-size: 0.85rem; color: var(--muted); }
@media (max-width: 480px) {
  .top { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
  .top .st { justify-self: center; }
  .stxt { display: none; }
  .word, .fig { font-size: 0.74rem; padding: 0 6px; }
  .top .figs { gap: 4px; }
}
</style>

.", "A **kivitelezési szerződések** többsége **2027-re csúszik**."], "source": "szegeder.hu", "status": "elakadt", "summary": "A város négy közlekedési és zöldfejlesztést mutatott be. A Nagykörút kerékpáros fejlesztése 1,3 milliárd forint támogatást nyert, befejezése 2029 áprilisára várható. A Vám téri csomópont 600 millió forint támogatásból és mintegy 355 millió forint önerőből készülhet. A kivitelezési szerződések többsége 2027-re csúszik.", "title": "Négy beruházást mutatnak be a szegedieknek a Városházán", "topic": "szeged", "url": "https://szegeder.hu/szeged/2026-10-16/negy-beruhazast-mutatnak-be-a-szegedieknek-a-varoshazan/", "word": "Kerékpárút"}, {"added_at": 1792347653972, "date": "2026-10-13", "figs": ["80 megálló"], "location": "Szeged-Szőreg, Szerb utca", "maps_query": "Szerb utca, Szőreg, Szeged", "points": ["A **Szerb utcai** buszmegállók utasvárói újulnak meg Szőregen.", "A munka egy városi program része, amely **80 megállót** érint, és a városi közlekedési cég **saját forrásából** valósul meg."], "source": "szeged365.hu", "status": "kivitelezes", "summary": "A Szerb utcai buszmegállók utasvárói újulnak meg Szőregen.", "title": "Szépül Szőreg: megújulnak a Szerb utcai buszmegállók utasvárói", "topic": "szeged", "url": "https://szeged365.hu/2026/10/13/szepul-szoreg-megujulnak-a-szerb-utcai-buszmegallok-utasvaroi/", "word": "Buszmegálló"}, {"added_at": 1792347609397, "date": "2026-10-12", "figs": ["125 M Ft", "dec. közepe"], "location": "Szeged-Újszeged, Bérkert utca", "maps_query": "Bérkert utca, Szeged", "points": ["Nagyjából **50 éves vezetékeket** cserélnek, nettó **125 millió Ft**-ból.", "A munka **december közepére** készülhet el, addig a Bérkert utcában **marad a forgalomkorlátozás**."], "source": "szeged365.hu", "status": "kivitelezes", "summary": "Nagyjából 50 éves vezetékeket cserélnek, nettó 125 millió Ft-ból.", "title": "Újszeged: 125 millió forintból újul meg a vízvezeték, marad a forgalomkorlátozás a Bérkert utcában", "topic": "szeged", "url": "https://szeged365.hu/2026/10/12/folytatodik-a-munka-ujszegeden-125-millio-forintbol-ujul-meg-a-vizvezetek-marad-a-forgalomkorlatozas-a-berkert-utcaban/", "word": "Vízvezeték"}, {"added_at": 1793250124521, "date": "2026-10-27", "figs": ["80 Mrd Ft", "2027"], "location": "Országos vasúthálózat", "maps_query": "MÁV vasúthálózat Magyarország", "points": ["A 2027-es költségvetés tervezete szerint a **vasúti felújítási keret** 30 milliárdról **80 milliárd Ft-ra** nő.", "A pénz a **pályafelújításokra**, kisebb állomási munkákra és a **lassújelek** megszüntetésére megy, nem az uniós nagyprojektekre."], "source": "Index", "status": "tervezes", "summary": "Vitézy Dávid közlekedési miniszter szerint 2027-ben 80 milliárd forint jut a vasúti infrastruktúra felújítására, a mostani 30 milliárd helyett (Index).", "title": "Vasúti pályafelújításra 2027-ben 80 milliárd jut", "topic": "melyepites", "url": "https://index.hu/gazdasag/2026/10/27/vitezy-david-kozlekedesi-beruhazasi-miniszter-vasut-felujitas-fejlesztes-penz-forras-mav", "word": "Vasútfelújítás"}]</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const TOPICS = [
    { key: "", label: "Minden" },
    { key: "szeged", label: "Szeged és környéke", sw: "var(--kresz-blue)" },
    { key: "melyepites", label: "Mélyépítés, útépítés", sw: "var(--kresz-green)" },
  ];
  const TOPIC_LABEL = { szeged: "Szeged", melyepites: "Mélyépítés", epitoipar: "Építőipar", kozlekedes: "Szeged" };
  const STATUS = {
    koncepcio: ["Koncepció", "Ötlet, bejelentés, tanulmány. Még nincs döntés vagy forrás."],
    tervezes: ["Tervezés", "Döntés vagy forrás van, tervezés folyik, tender még nincs."],
    kozbeszerzes: ["Közbeszerzés", "Tender kiírva vagy elbírálás alatt."],
    kivitelezes: ["Kivitelezés", "Szerződés megkötve, a munka folyik."],
    atadva: ["Átadva", "Forgalomba helyezve, használatba véve."],
    elakadt: ["Elakadt", "Csúszik, leállt, eredménytelen tender vagy forráshiány."],
    lezaras: ["Lezárás", "Teljes útzár, híd- vagy csomópont-lezárás."],
    tereles: ["Terelés", "Forgalom vagy tömegközlekedés más útvonalon."],
    korlatozas: ["Korlátozás", "Félpályás, sávszűkítés, sebességkorlátozás, pótlóbusz."],
    megszunt: ["Megszűnt", "A korlátozás véget ért, a forgalom helyreállt."],
  };
  const BUILD_ST = ["koncepcio", "tervezes", "kozbeszerzes", "kivitelezes", "atadva", "elakadt"];
  const TRAFFIC_ST = ["lezaras", "tereles", "korlatozas", "megszunt"];
  const LIMIT = 40;
  const NEW_MS = 3 * 24 * 3600 * 1000;
  const TABS = [
    { key: "epites", label: "Építési hírek", match: (d) => d.topic !== "kozlekedes", chips: true,
      empty: "Ebben a témában még nincs hír. A témafigyelő naponta egyszer, reggel 6-kor gyűjt." },
    { key: "kozlekedes", label: "Közlekedési hírek", match: (d) => d.topic === "kozlekedes", chips: false,
      empty: "Még nincs közlekedési hír. Szeged és a közvetlen környék forgalmi hírei a reggeli gyűjtéssel kerülnek ide." },
    { key: "jelek", label: "Jelmagyarázat", legend: true },
  ];
  let items = null, topic = "", tab = "epites";
  try { topic = localStorage.getItem("hirfal-topic") || ""; tab = localStorage.getItem("hirfal-tab") || tab; } catch (e) {}
  const hash = (location.hash || "").slice(1);
  if (TABS.some((t) => t.key === hash)) tab = hash;
  if (!TABS.some((t) => t.key === tab)) tab = "epites";
  const curTab = () => TABS.find((t) => t.key === tab);

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function sign(id, label) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("role", "img"); s.setAttribute("aria-label", label);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "title"); t.textContent = label; s.append(t);
    const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#s-" + id); s.append(u);
    return s;
  }
  // Points may mark key phrases as **bold**; build nodes, never innerHTML.
  function rich(node, text) {
    String(text).split(/(\*\*[^*]+\*\*)/).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) node.append(el("b", null, part.slice(2, -2)));
      else if (part) node.append(document.createTextNode(part));
    });
    return node;
  }
  const MONTHS = ["jan.", "febr.", "márc.", "ápr.", "máj.", "jún.", "júl.", "aug.", "szept.", "okt.", "nov.", "dec."];
  function fmtDate(s) {
    const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(s || "");
    if (!m) return s || "";
    const mon = MONTHS[parseInt(m[2], 10) - 1] || m[2];
    return m[3] ? mon + " " + parseInt(m[3], 10) + "." : m[1] + ". " + mon;
  }

  function renderTabs() {
    const box = $("tabs"); box.replaceChildren();
    for (const t of TABS) {
      const b = el("button", "tab", t.label); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(t.key === tab));
      if (items && t.match) b.append(el("span", "n", String(items.filter(t.match).length)));
      b.addEventListener("click", () => { tab = t.key; try { localStorage.setItem("hirfal-tab", tab); } catch (e) {} render(); });
      box.append(b);
    }
  }

  function renderChips() {
    const box = $("chips"); box.replaceChildren();
    for (const t of TOPICS) {
      const b = el("button", "chip"); b.type = "button";
      if (t.sw) { const i = el("i"); i.style.background = t.sw; b.append(i); }
      b.append(document.createTextNode(t.label));
      b.setAttribute("aria-pressed", String(t.key === topic));
      if (items) b.append(el("span", "n", String(items.filter(curTab().match).filter((d) => !t.key || d.topic === t.key).slice(0, LIMIT).length)));
      b.addEventListener("click", () => { topic = t.key; try { localStorage.setItem("hirfal-topic", topic); } catch (e) {} render(); });
      box.append(b);
    }
  }

  function card(d, now) {
    const art = el("article", "sg " + (d.topic || ""));
    const band = el("div", "band");
    const bl = el("div", "bl");
    bl.append(el("span", null, d.area || TOPIC_LABEL[d.topic] || d.topic || ""));
    if (d.location) {
      const a = el("a", null, d.location);
      a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.maps_query || d.location);
      a.target = "_blank"; a.rel = "noopener"; a.title = "Megnyitás a Google Térképen";
      bl.append(a);
    }
    const br = el("div", "br");
    br.append(el("span", null, fmtDate(d.date)));
    if (d.added_at && now - d.added_at < NEW_MS) br.append(el("span", "sticker", "ÚJ"));
    band.append(bl, br);
    art.append(band);

    const inner = el("div", "inner");
    if (d.word || d.status || (d.figs && d.figs.length)) {
      const top = el("div", "top");
      const w = el("div"); if (d.word) { w.className = "word"; w.textContent = d.word; }
      const st = el("div", "st");
      if (STATUS[d.status]) { st.append(sign(d.status, STATUS[d.status][0]), el("span", "stxt", STATUS[d.status][0])); }
      const figs = el("div", "figs");
      (Array.isArray(d.figs) ? d.figs : []).slice(0, 2).forEach((f) => figs.append(el("span", "fig", f)));
      top.append(w, st, figs);
      inner.append(top);
    }
    const h = el("h3");
    const a = el("a", null, d.title || "(cím nélkül)");
    if (d.url) { a.href = d.url; a.target = "_blank"; a.rel = "noopener"; }
    h.append(a); inner.append(h);
    if (Array.isArray(d.points) && d.points.length) {
      if (d.lead) inner.append(el("p", "lead", d.lead));
      const ul = el("ul");
      for (const p of d.points) ul.append(rich(el("li"), p));
      inner.append(ul);
    } else if (d.summary) inner.append(el("p", "sum", d.summary));
    if (d.source) inner.append(el("div", "src", d.source));
    art.append(inner);
    return art;
  }

  function renderLegend() {
    const box = $("legend"); box.replaceChildren();
    const sec = (title, note, rows) => {
      const s = el("section", "legend-sec"); s.append(el("h2", null, title));
      if (note) s.append(el("p", "note", note));
      const g = el("div", "legend"); rows.forEach((r) => g.append(r)); s.append(g); return s;
    };
    const stRow = (k) => { const r = el("div", "lg"); r.append(sign(k, STATUS[k][0]), el("b", null, STATUS[k][0]), el("span", null, STATUS[k][1])); return r; };
    const swRow = (c, n, txt) => { const r = el("div", "lg"); const s = el("div", "sw"); s.style.background = c; r.append(s, el("b", null, n), el("span", null, txt)); return r; };
    box.append(
      sec("Építési állapotok", "Minden hír legfeljebb egy jelzőt kap, a forrás alapján. Ha a forrásból nem derül ki, nem kap jelzőt.", BUILD_ST.map(stRow)),
      sec("Közlekedési állapotok", null, TRAFFIC_ST.map(stRow)),
      sec("A kártya részei", null, [
        swRow("var(--kresz-blue)", "Kék sáv", "Szeged és környéke, a közlekedési hírek is."),
        swRow("var(--kresz-green)", "Zöld sáv", "Országos mélyépítés, út, vasút."),
        swRow("var(--kresz-yellow)", "Sárga szám", "Összeg, hossz vagy dátum a forrásból."),
        swRow("var(--kresz-red)", "Új matrica", "Az elmúlt 3 napban került fel."),
      ])
    );
  }

  function render() {
    const t = curTab();
    renderTabs();
    $("chips").hidden = !t.chips;
    if (t.chips) renderChips();
    $("legend").hidden = !t.legend;
    $("news").hidden = !!t.legend;
    $("foot").hidden = !!t.legend;
    const list = $("news"); list.replaceChildren();
    if (t.legend) { $("empty").hidden = true; renderLegend(); return; }
    const shown = (items || []).filter(t.match).filter((d) => !t.chips || !topic || d.topic === topic).slice(0, LIMIT);
    $("empty").textContent = t.empty;
    $("empty").hidden = !items || shown.length > 0;
    const now = Date.now();
    for (const d of shown) list.append(card(d, now));
  }

  // Static build: the news are baked into the page at build time.
  items = JSON.parse(document.getElementById("hirfal-data").textContent)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.added_at || 0) - (a.added_at || 0));
  const last = items.reduce((m, d) => Math.max(m, d.added_at || 0), 0);
  $("meta").textContent = items.length ? "Utolsó frissítés: " + new Date(last).toLocaleString("hu-HU", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "Még nincs hír.";
  render();
})();
</script>

</body>
